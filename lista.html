<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presentes — Oliver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="lista-header">
    <a class="lista-header__voltar" href="index.html">← voltar</a>
    <h1 class="lista-header__titulo">Lista de Presentes</h1>
    <p class="lista-header__sub">escolha o que quiser presentear</p>
  </header>

  <main id="grid" class="lista-grid"></main>

  <script>
    fetch('gifts.json')
      .then(r => r.json())
      .then(gifts => {
        const grid = document.getElementById('grid');
        grid.innerHTML = gifts.map(g => {
          const img = g.image
            ? `<img src="${g.image}" alt="${g.name}" loading="lazy">`
            : '🎁';
          const btn = g.stripePaymentLink
            ? `<a class="card__btn" href="${g.stripePaymentLink}" target="_blank" rel="noopener">Presentear</a>`
            : `<span class="card__btn" style="background:var(--bege);color:var(--texto-suave);cursor:default">Em breve</span>`;
          return `
            <article class="card">
              <div class="card__img">${img}</div>
              <div class="card__body">
                <p class="card__nome">${g.name}</p>
                <p class="card__preco">R$&nbsp;${g.price.toLocaleString('pt-BR')}</p>
                ${btn}
              </div>
            </article>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML =
          '<p style="padding:24px;color:var(--texto-suave)">Não foi possível carregar a lista.</p>';
      });
  </script>
</body>
</html>
